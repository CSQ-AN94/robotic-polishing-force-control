<svg width="100%" viewBox="0 0 700 215" xmlns="http://www.w3.org/2000/svg" role="img">
<title>切平面位置控制回路，含公式与感知输入</title>
<desc>光栅目标位置与当前位置比较，误差投影到局部切平面，再用阻抗律算出切向力，直接反馈实际位置（不做低通滤波），最终输出的切向力与法向力回路的输出相加构成完整任务力。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
text { font-family: -apple-system, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif; }
.t{font-size:14px;fill:#1a1a1a;}
.ts{font-size:12.5px;fill:#444;}
.th{font-size:14px;font-weight:600;fill:#1a1a1a;}
.box{fill:#f7f7f7;stroke:#999;stroke-width:0.75;}
.arr{stroke:#888;stroke-width:1.5;fill:none;}
.sub{baseline-shift:sub;font-size:9px;}
</style>

<text class="ts" x="15" y="94">x<tspan class="sub">d</tspan>(t)</text>
<line x1="55" y1="90" x2="128" y2="90" class="arr" marker-end="url(#arrow)"/>

<circle cx="144" cy="90" r="16" class="box"/>
<text class="th" x="144" y="90" text-anchor="middle" dominant-baseline="central">Σ</text>
<text class="ts" x="115" y="70">+</text>
<text class="ts" x="144" y="132" text-anchor="middle">−</text>

<line x1="160" y1="90" x2="180" y2="90" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="278" y="42" text-anchor="middle">n̂(x)→</text>

<rect x="180" y="62" width="196" height="56" rx="6" class="box"/>
<text class="th" x="278" y="80" text-anchor="middle" dominant-baseline="central">切平面投影</text>
<text class="ts" x="278" y="102" text-anchor="middle" dominant-baseline="central">e<tspan class="sub">tan</tspan> = e − (e·n̂)n̂</text>

<line x1="376" y1="90" x2="396" y2="90" class="arr" marker-end="url(#arrow)"/>

<rect x="396" y="62" width="180" height="56" rx="6" class="box"/>
<text class="th" x="486" y="80" text-anchor="middle" dominant-baseline="central">阻抗律(切向)</text>
<text class="ts" x="486" y="102" text-anchor="middle" dominant-baseline="central">F = K<tspan class="sub">p</tspan>e<tspan class="sub">tan</tspan> − K<tspan class="sub">d</tspan>v<tspan class="sub">tan</tspan></text>

<line x1="576" y1="90" x2="593" y2="90" class="arr" marker-end="url(#arrow)"/>
<circle cx="596" cy="90" r="3" fill="#888"/>
<text class="ts" x="603" y="94">F<tspan class="sub">tan</tspan></text>

<path d="M596,90 L596,175 L136,175 L136,107" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="366" y="167" text-anchor="middle">x(s) 直接测量(无滤波)</text>
</svg>
