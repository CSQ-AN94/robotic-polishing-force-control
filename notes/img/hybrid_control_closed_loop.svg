<svg viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">RM65-B 打磨系统的混合控制闭环</title>
  <desc id="desc">点云预扫描得到局部法线。光栅目标进入切平面阻抗回路，目标力进入法向显式力控制回路，局部法线还决定工具压入轴姿态。三路任务空间控制量组成六维力旋量，经雅可比转置和动力学补偿变成六个机械臂关节力矩。独立气动预载驱动工具滑台。MuJoCo 动力学和接触输出位姿、速度与接触力并反馈到各控制回路；快速安全监控在持续过力时覆盖正常控制并进入撤离锁定。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      :root {
        color-scheme: light dark;
      }
      text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        fill: #1f2937;
      }
      .title { font-size: 21px; font-weight: 600; }
      .label { font-size: 17px; font-weight: 600; }
      .body { font-size: 15px; }
      .small { font-size: 13px; fill: #4b5563; }
      .mono { font-family: "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13px; }
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.4; }
      .sense { fill: #eff6ff; stroke: #60a5fa; stroke-width: 1.4; }
      .tangent { fill: #ecfdf5; stroke: #34d399; stroke-width: 1.4; }
      .normal { fill: #fff7ed; stroke: #fb923c; stroke-width: 1.4; }
      .orient { fill: #f5f3ff; stroke: #a78bfa; stroke-width: 1.4; }
      .plant { fill: #f8fafc; stroke: #64748b; stroke-width: 1.6; }
      .safety { fill: #fef2f2; stroke: #ef4444; stroke-width: 1.5; }
      .pneu { fill: #f0fdfa; stroke: #14b8a6; stroke-width: 1.4; }
      .line { fill: none; stroke: #64748b; stroke-width: 1.7; marker-end: url(#arrow); }
      .thin { fill: none; stroke: #94a3b8; stroke-width: 1.35; marker-end: url(#arrow); }
      .return { fill: none; stroke: #94a3b8; stroke-width: 1.35; }
      .return-normal { fill: none; stroke: #ea580c; stroke-width: 1.8; }
      .return-safety { fill: none; stroke: #dc2626; stroke-width: 1.8; stroke-dasharray: 7 5; }
      .normal-line { fill: none; stroke: #ea580c; stroke-width: 1.8; marker-end: url(#arrow); }
      .tangent-line { fill: none; stroke: #059669; stroke-width: 1.8; marker-end: url(#arrow); }
      .orient-line { fill: none; stroke: #7c3aed; stroke-width: 1.8; marker-end: url(#arrow); }
      .sense-line { fill: none; stroke: #2563eb; stroke-width: 1.55; stroke-dasharray: 6 5; marker-end: url(#arrow); }
      .safety-line { fill: none; stroke: #dc2626; stroke-width: 1.8; stroke-dasharray: 7 5; marker-end: url(#arrow); }
      .bus { fill: none; stroke: #475569; stroke-width: 2.2; marker-end: url(#arrow); }
      .lane { font-size: 13px; font-weight: 600; letter-spacing: .04em; }
      @media (prefers-color-scheme: dark) {
        text { fill: #e5e7eb; }
        .small { fill: #cbd5e1; }
        .box { fill: #111827; stroke: #64748b; }
        .sense { fill: #0f2747; stroke: #60a5fa; }
        .tangent { fill: #0b2f27; stroke: #34d399; }
        .normal { fill: #3a2412; stroke: #fb923c; }
        .orient { fill: #251b45; stroke: #a78bfa; }
        .plant { fill: #172033; stroke: #94a3b8; }
        .safety { fill: #3a1519; stroke: #f87171; }
        .pneu { fill: #0c302e; stroke: #2dd4bf; }
      }
    </style>
  </defs>

  <text x="600" y="34" text-anchor="middle" class="title">同一局部法线连接运动、力与姿态，安全通道独立覆盖正常控制</text>

  <!-- perception pre-scan -->
  <rect x="34" y="58" width="1132" height="72" rx="10" class="sense"/>
  <text x="60" y="84" class="label">打磨前感知</text>
  <text x="60" y="108" class="body">Gemini 深度图 → 世界坐标点云 → 分箱 SVD 拟合 → 法线查表</text>
  <rect x="930" y="73" width="204" height="42" rx="8" class="box"/>
  <text x="1032" y="99" text-anchor="middle" class="body">当前位置查询  n̂(x)</text>

  <!-- lane labels -->
  <text x="34" y="174" class="lane" fill="#059669">切平面运动回路</text>
  <text x="34" y="306" class="lane" fill="#ea580c">法向力回路</text>
  <text x="34" y="438" class="lane" fill="#7c3aed">工具轴姿态回路</text>

  <!-- tangential loop -->
  <rect x="34" y="188" width="150" height="78" rx="9" class="box"/>
  <text x="109" y="216" text-anchor="middle" class="label">光栅目标</text>
  <text x="109" y="241" text-anchor="middle" class="mono">x_d, v_d</text>

  <rect x="224" y="188" width="222" height="78" rx="9" class="tangent"/>
  <text x="335" y="214" text-anchor="middle" class="label">切平面投影</text>
  <text x="335" y="239" text-anchor="middle" class="mono">e_t=P_t(x_d−x)</text>
  <text x="335" y="258" text-anchor="middle" class="small">P_t=I−n̂n̂ᵀ</text>

  <rect x="486" y="188" width="214" height="78" rx="9" class="tangent"/>
  <text x="593" y="214" text-anchor="middle" class="label">切向阻抗</text>
  <text x="593" y="241" text-anchor="middle" class="mono">F_t=K_p e_t−K_d v_t</text>

  <path d="M184 227 H224" class="tangent-line"/>
  <path d="M446 227 H486" class="tangent-line"/>

  <!-- normal loop -->
  <rect x="34" y="320" width="150" height="78" rx="9" class="box"/>
  <text x="109" y="348" text-anchor="middle" class="label">目标力爬升</text>
  <text x="109" y="373" text-anchor="middle" class="mono">f_d: 0→8 N</text>

  <circle cx="250" cy="359" r="28" class="normal"/>
  <text x="250" y="365" text-anchor="middle" class="label">Σ</text>
  <text x="216" y="342" class="small">+</text>
  <text x="247" y="402" class="small">−</text>

  <rect x="318" y="320" width="218" height="78" rx="9" class="normal"/>
  <text x="427" y="346" text-anchor="middle" class="label">PI + 法向阻尼</text>
  <text x="427" y="370" text-anchor="middle" class="mono">F_n=−(f_d+K_p e+K_i∫e dt)</text>
  <text x="427" y="390" text-anchor="middle" class="mono">−B_n(v·n̂)</text>

  <rect x="576" y="320" width="124" height="78" rx="9" class="normal"/>
  <text x="638" y="348" text-anchor="middle" class="label">沿法线</text>
  <text x="638" y="375" text-anchor="middle" class="mono">F_n n̂</text>

  <path d="M184 359 H222" class="normal-line"/>
  <path d="M278 359 H318" class="normal-line"/>
  <path d="M536 359 H576" class="normal-line"/>

  <!-- orientation loop -->
  <rect x="34" y="452" width="150" height="78" rx="9" class="box"/>
  <text x="109" y="480" text-anchor="middle" class="label">目标压入轴</text>
  <text x="109" y="505" text-anchor="middle" class="mono">a_d=−n̂</text>

  <rect x="224" y="452" width="222" height="78" rx="9" class="orient"/>
  <text x="335" y="478" text-anchor="middle" class="label">轴对齐误差</text>
  <text x="335" y="503" text-anchor="middle" class="mono">e_R=a×a_d</text>

  <rect x="486" y="452" width="214" height="78" rx="9" class="orient"/>
  <text x="593" y="478" text-anchor="middle" class="label">姿态 PD</text>
  <text x="593" y="503" text-anchor="middle" class="mono">M=K_R e_R−D_Rω</text>

  <path d="M184 491 H224" class="orient-line"/>
  <path d="M446 491 H486" class="orient-line"/>

  <!-- normal lookup fanout -->
  <path d="M1032 115 V152 H335 V188" class="sense-line"/>
  <path d="M1032 115 V152 H638 V320" class="sense-line"/>
  <path d="M1032 115 V152 H109 V452" class="sense-line"/>
  <text x="744" y="148" class="small">同一个 n̂(x) 供三条回路使用</text>

  <!-- wrench assembly and torque mapping -->
  <rect x="750" y="204" width="196" height="306" rx="12" class="box"/>
  <text x="848" y="234" text-anchor="middle" class="label">任务空间组合</text>
  <line x1="774" y1="249" x2="922" y2="249" stroke="#cbd5e1"/>
  <text x="848" y="282" text-anchor="middle" class="body">切向力  F_t</text>
  <text x="848" y="325" text-anchor="middle" class="body">法向力  F_n n̂</text>
  <text x="848" y="368" text-anchor="middle" class="body">姿态力矩  M</text>
  <text x="848" y="414" text-anchor="middle" class="mono">w=[F_t+F_n n̂; M]</text>
  <rect x="774" y="439" width="148" height="48" rx="8" class="plant"/>
  <text x="848" y="468" text-anchor="middle" class="mono">τ=J_armᵀw+q_bias</text>

  <path d="M700 227 H750" class="tangent-line"/>
  <path d="M700 359 H750" class="normal-line"/>
  <path d="M700 491 H750" class="orient-line"/>

  <!-- plant -->
  <rect x="984" y="188" width="182" height="342" rx="12" class="plant"/>
  <text x="1075" y="222" text-anchor="middle" class="label">RM65-B + 工具</text>
  <text x="1075" y="248" text-anchor="middle" class="body">MuJoCo 动力学</text>
  <text x="1075" y="271" text-anchor="middle" class="body">约束、摩擦与接触</text>
  <line x1="1008" y1="290" x2="1142" y2="290" stroke="#cbd5e1"/>
  <text x="1075" y="324" text-anchor="middle" class="small">输入</text>
  <text x="1075" y="348" text-anchor="middle" class="mono">6 个关节力矩 τ</text>
  <text x="1075" y="371" text-anchor="middle" class="mono">气动预载</text>
  <text x="1075" y="410" text-anchor="middle" class="small">输出 / 反馈</text>
  <text x="1075" y="434" text-anchor="middle" class="mono">x, v, R, ω</text>
  <text x="1075" y="458" text-anchor="middle" class="mono">接触力向量 f</text>
  <path d="M946 463 H984" class="bus"/>

  <!-- pneumatic preload -->
  <rect x="750" y="542" width="196" height="64" rx="9" class="pneu"/>
  <text x="848" y="568" text-anchor="middle" class="label">独立气动滑台预载</text>
  <text x="848" y="591" text-anchor="middle" class="mono">pneumatic_force ≈ 4 N</text>
  <path d="M946 574 H1075 V530" class="line"/>

  <!-- pose/velocity feedback bus, routed outside the task-combination block -->
  <path d="M1075 530 V620 H724" class="return"/>
  <path d="M724 620 V286 H335" class="return"/>
  <path d="M335 286 V266" class="thin"/>
  <text x="544" y="280" text-anchor="middle" class="small">位置 / 速度反馈</text>
  <path d="M724 620 V550 H335" class="return"/>
  <path d="M335 550 V530" class="thin"/>
  <text x="544" y="545" text-anchor="middle" class="small">工具轴 / 角速度反馈</text>

  <!-- independent raw-force safety channel -->
  <rect x="34" y="638" width="310" height="86" rx="10" class="safety"/>
  <text x="189" y="665" text-anchor="middle" class="label">独立安全通道</text>
  <text x="189" y="690" text-anchor="middle" class="small">快滤波：法向 10 N / 合力 20 N</text>
  <text x="189" y="712" text-anchor="middle" class="small">持续 25 ms → 撤离 → 释放后锁定</text>

  <!-- normal-force feedback with the slow tracking filter -->
  <rect x="500" y="650" width="200" height="48" rx="8" class="normal"/>
  <text x="600" y="679" text-anchor="middle" class="small">慢滤波 α=0.03：f_n=f·n̂</text>
  <path d="M1075 530 V740 H600" class="return-normal"/>
  <path d="M600 740 V698" class="normal-line"/>
  <path d="M500 674 H470 V426 H250" class="return-normal"/>
  <path d="M250 426 V387" class="normal-line"/>

  <!-- raw-force safety branch and trip override -->
  <path d="M600 740 H189" class="return-safety"/>
  <path d="M189 740 V724" class="safety-line"/>
  <path d="M344 650 H714 V487" class="return-safety"/>
  <path d="M714 487 H774" class="safety-line"/>
  <text x="525" y="644" text-anchor="middle" class="small">trip 覆盖正常 wrench</text>
</svg>
