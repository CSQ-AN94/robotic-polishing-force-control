<svg viewBox="0 0 840 750" xmlns="http://www.w3.org/2000/svg" role="img">
<title>控制循环：每个仿真步内部发生的逻辑</title>
<desc>流程图：读取状态、计算雅可比矩阵，根据时间判断阶段（下降期用全轴阻抗控制，打磨期 xy 用位置阻抗、z 轴切换为显式力控），合并为任务空间力，转换为关节力矩并加上重力前馈，推进仿真一步后循环回到开头。</desc>
<defs>
<marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#666" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
text { font-family: -apple-system, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1a1a1a; }
.th { font-size: 14px; font-weight: 500; }
.ts { font-size: 12px; fill: #555; }
.box { fill: #fafafa; stroke: #999; stroke-width: 0.75; }
.arr { stroke: #666; stroke-width: 1.5; }
</style>

<g>
<rect x="260" y="20" width="280" height="64" rx="4" class="box"/>
<text x="400" y="46" text-anchor="middle" class="th">读取传感器状态</text>
<text x="400" y="68" text-anchor="middle" class="ts">位置/速度/滤波后接触力</text>
</g>
<path d="M400 84 V116" class="arr" marker-end="url(#arrow2)" fill="none"/>

<g>
<rect x="260" y="124" width="280" height="64" rx="4" class="box"/>
<text x="400" y="150" text-anchor="middle" class="th">计算雅可比矩阵 J</text>
<text x="400" y="172" text-anchor="middle" class="ts">关节→末端速度映射</text>
</g>
<path d="M400 188 V220" class="arr" marker-end="url(#arrow2)" fill="none"/>

<polygon points="400,228 490,273 400,318 310,273" fill="#fafafa" stroke="#999" stroke-width="0.75"/>
<text x="400" y="278" text-anchor="middle" class="ts">t &lt; 3 秒?</text>

<path d="M310 273 H200 V342" class="arr" marker-end="url(#arrow2)" fill="none"/>
<path d="M490 273 H600 V342" class="arr" marker-end="url(#arrow2)" fill="none"/>
<text x="255" y="262" text-anchor="middle" class="ts">是</text>
<text x="545" y="262" text-anchor="middle" class="ts">否</text>

<g>
<rect x="60" y="350" width="280" height="70" rx="4" class="box"/>
<text x="200" y="378" text-anchor="middle" class="th">阶段 1：接近下降</text>
<text x="200" y="400" text-anchor="middle" class="ts">x/y/z/姿态 全部阻抗控制</text>
</g>

<g>
<rect x="460" y="350" width="280" height="70" rx="4" class="box"/>
<text x="600" y="378" text-anchor="middle" class="th">阶段 2：打磨中</text>
<text x="600" y="400" text-anchor="middle" class="ts">xy 阻抗 + z 显式力控(PI)</text>
</g>

<path d="M200 420 V440 H390 V452" class="arr" marker-end="url(#arrow2)" fill="none"/>
<path d="M600 420 V440 H410 V452" class="arr" marker-end="url(#arrow2)" fill="none"/>

<g>
<rect x="260" y="460" width="280" height="64" rx="4" class="box"/>
<text x="400" y="486" text-anchor="middle" class="th">任务空间力 F_task</text>
<text x="400" y="508" text-anchor="middle" class="ts">xy 位置项 + z 力项</text>
</g>
<path d="M400 524 V552" class="arr" marker-end="url(#arrow2)" fill="none"/>

<g>
<rect x="240" y="560" width="320" height="64" rx="4" class="box"/>
<text x="400" y="586" text-anchor="middle" class="th">τ = Jᵀ·F + 重力前馈</text>
<text x="400" y="608" text-anchor="middle" class="ts">转换为关节力矩指令</text>
</g>
<path d="M400 624 V652" class="arr" marker-end="url(#arrow2)" fill="none"/>

<g>
<rect x="240" y="660" width="320" height="64" rx="4" class="box"/>
<text x="400" y="686" text-anchor="middle" class="th">mj_step() 推进物理</text>
<text x="400" y="708" text-anchor="middle" class="ts">仿真时间前进一个 dt</text>
</g>

<path d="M560 692 H780 V52 H548" class="arr" marker-end="url(#arrow2)" fill="none"/>
<text x="660" y="44" text-anchor="middle" class="ts">下一帧，重复</text>
</svg>
