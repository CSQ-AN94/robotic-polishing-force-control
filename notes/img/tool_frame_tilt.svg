<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" role="img">
<title>打磨头姿态：固定朝下 vs 实时贴合法线</title>
<desc>工件横截面：平面段打磨头垂直朝下，圆弧段打磨头姿态跟随局部表面法线倾斜，按压方向始终垂直于当前表面。</desc>
<style>
text { font-family: -apple-system, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1a1a1a; }
.s { font-size: 12.5px; fill: #444; }
.lbl { font-size: 12px; fill: #666; }
</style>
<defs>
<marker id="az" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#c0392b" stroke-width="1.6" stroke-linecap="round"/>
</marker>
<marker id="an" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#2b7a4b" stroke-width="1.4" stroke-linecap="round"/>
</marker>
</defs>

<!-- workpiece cross-section: flat then arc. Surface y as function of x. -->
<!-- flat from x=60..380 at y=300; arc rising from x=380..700 -->
<path d="M60 300 L380 300 Q560 300 700 200 L700 360 L60 360 Z"
  fill="#e8e8ee" stroke="#888" stroke-width="1.5"/>
<text x="200" y="345" class="lbl" text-anchor="middle">平面段（法线竖直向上）</text>
<text x="560" y="352" class="lbl" text-anchor="middle">圆弧段（法线逐渐倾斜）</text>

<!-- tool pad 1 on flat: vertical -->
<circle cx="180" cy="292" r="9" fill="#e08e0b" stroke="#a0670a"/>
<!-- surface normal (green, up) -->
<line x1="180" y1="292" x2="180" y2="245" stroke="#2b7a4b" stroke-width="1.4" marker-end="url(#an)"/>
<!-- pressing z axis (red, down into surface) -->
<line x1="180" y1="255" x2="180" y2="292" stroke="#c0392b" stroke-width="2" marker-end="url(#az)"/>
<text x="180" y="235" class="s" text-anchor="middle" fill="#2b7a4b">法线</text>

<!-- tool pad 2 on gentle arc (~x=470, slope moderate) -->
<!-- surface point approx (470, 289); normal tilted ~18deg -->
<circle cx="470" cy="286" r="9" fill="#e08e0b" stroke="#a0670a"/>
<line x1="470" y1="286" x2="455" y2="241" stroke="#2b7a4b" stroke-width="1.4" marker-end="url(#an)"/>
<line x1="458" y1="250" x2="470" y2="286" stroke="#c0392b" stroke-width="2" marker-end="url(#az)"/>

<!-- tool pad 3 on steep arc (~x=620, steeper) -->
<circle cx="620" cy="252" r="9" fill="#e08e0b" stroke="#a0670a"/>
<line x1="620" y1="252" x2="588" y2="216" stroke="#2b7a4b" stroke-width="1.4" marker-end="url(#an)"/>
<line x1="595" y1="223" x2="620" y2="252" stroke="#c0392b" stroke-width="2" marker-end="url(#az)"/>

<!-- legend -->
<line x1="450" y1="40" x2="480" y2="40" stroke="#2b7a4b" stroke-width="1.4" marker-end="url(#an)"/>
<text x="488" y="44" class="s">局部表面法线（点云拟合得到）</text>
<line x1="450" y1="64" x2="480" y2="64" stroke="#c0392b" stroke-width="2" marker-end="url(#az)"/>
<text x="488" y="68" class="s">打磨头按压方向 = 法线反向</text>
<text x="60" y="44" class="s">按压方向始终</text>
<text x="60" y="64" class="s">垂直于当前表面</text>
</svg>
