<svg width="100%" viewBox="0 0 680 180" xmlns="http://www.w3.org/2000/svg" role="img">
<title>感知管线：深度相机到局部法线查表</title>
<desc>深度相机拍摄一张深度图，经针孔相机公式反投影重建世界坐标点云，按x分箱做SVD局部平面拟合得到法线，最终形成一张按x查法线的查找表，供后续控制回路使用。整个过程只在打磨开始前执行一次。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
text { font-family: -apple-system, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif; }
.t{font-size:14px;fill:#1a1a1a;}
.ts{font-size:12.5px;fill:#444;}
.th{font-size:14px;font-weight:600;fill:#1a1a1a;}
.box{fill:#f7f7f7;stroke:#999;stroke-width:0.75;}
.arr{stroke:#888;stroke-width:1.5;fill:none;}
.sub{baseline-shift:sub;font-size:9px;}
</style>

<rect x="30" y="60" width="130" height="56" rx="6" class="box"/>
<text class="th" x="95" y="80" text-anchor="middle" dominant-baseline="central">深度相机</text>
<text class="ts" x="95" y="100" text-anchor="middle" dominant-baseline="central">Gemini 336L</text>

<line x1="160" y1="88" x2="180" y2="88" class="arr" marker-end="url(#arrow)"/>

<rect x="180" y="60" width="150" height="56" rx="6" class="box"/>
<text class="th" x="255" y="80" text-anchor="middle" dominant-baseline="central">点云重建</text>
<text class="ts" x="255" y="100" text-anchor="middle" dominant-baseline="central">x = (u−c<tspan class="sub">x</tspan>)d/f</text>

<line x1="330" y1="88" x2="350" y2="88" class="arr" marker-end="url(#arrow)"/>

<rect x="350" y="60" width="160" height="56" rx="6" class="box"/>
<text class="th" x="430" y="80" text-anchor="middle" dominant-baseline="central">SVD 平面拟合</text>
<text class="ts" x="430" y="100" text-anchor="middle" dominant-baseline="central">n̂ = 最小奇异向量</text>

<line x1="510" y1="88" x2="530" y2="88" class="arr" marker-end="url(#arrow)"/>

<rect x="530" y="60" width="110" height="56" rx="6" class="box"/>
<text class="th" x="585" y="80" text-anchor="middle" dominant-baseline="central">法线查表</text>
<text class="ts" x="585" y="100" text-anchor="middle" dominant-baseline="central">插值查表</text>

<line x1="585" y1="116" x2="585" y2="140" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="585" y="155" text-anchor="middle">输出: n̂(x)</text>
</svg>
